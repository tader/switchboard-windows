name: Windows release (unsigned installers)
on:
  workflow_call:
    inputs:
      tag: {type: string, required: true}
  workflow_dispatch:
    inputs:
      tag: {description: Existing release tag, required: true}
permissions:
  contents: write
jobs:
  release:
    environment: windows-release
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.tag }}'}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Check release prerequisites
        shell: pwsh
        env:
          FEED_KEY: ${{ secrets.UPDATE_FEED_PRIVATE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          foreach ($name in 'FEED_KEY') { if (!(Get-Item "env:$name").Value) { throw "Missing signing prerequisite: $name" } }
          if ($env:TAG -ne "v$((Get-Content version.txt).Trim())") { throw 'Release tag mismatch' }
          if (!(Test-Path Assets/update-public-key.pem)) { throw 'Missing embedded update key' }
      - name: Build unsigned installers and authenticate update metadata
        shell: pwsh
        env:
          FEED_KEY: ${{ secrets.UPDATE_FEED_PRIVATE_KEY }}
        run: |
          $version = (Get-Content version.txt).Trim()
          dotnet publish src/Switchboard/Switchboard.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:ReleaseUpdatesEnabled=true -p:Version=$version -o .dist/app
          if ($LASTEXITCODE) { throw 'Build failed' }
          dotnet tool install vpk --version 1.2.161 --tool-path .tools
          .tools/vpk pack --packId Switchboard.Windows --packVersion $version --packDir .dist/app --mainExe Switchboard.exe --channel ${{ matrix.rid }} --runtime ${{ matrix.rid }} --icon Assets/AppIcon.ico --outputDir .dist/release
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $installer = Get-ChildItem .dist/release/*Setup.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          Rename-Item $installer.FullName "Switchboard-$version-${{ matrix.rid }}-unsigned-Setup.exe"
          foreach ($portable in Get-ChildItem .dist/release/*Portable.zip) { Rename-Item $portable.FullName "Switchboard-$version-${{ matrix.rid }}-unsigned-Portable.zip" }
          $key = "$env:RUNNER_TEMP/feed-private.pem"
          try {
            [IO.File]::WriteAllText($key,$env:FEED_KEY)
            $feed = ".dist/release/releases.${{ matrix.rid }}.json"
            openssl dgst -sha256 -sign $key -out "$feed.sig" $feed
            if ($LASTEXITCODE) { throw 'Feed signing failed' }
            openssl dgst -sha256 -verify Assets/update-public-key.pem -signature "$feed.sig" $feed
            if ($LASTEXITCODE) { throw 'Feed verification failed' }
          } finally { Remove-Item $key -Force -ErrorAction SilentlyContinue }
      - name: Upload release assets with authenticated update feeds
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}'}
        run: gh release upload "$env:TAG" .dist/release/* --repo "${{ github.repository }}" --clobber

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after both architectures succeed
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag }}', GH_REPO: '${{ github.repository }}'}
        run: gh release edit "$TAG" --title "Switchboard for Windows $TAG (unsigned)" --draft=false
