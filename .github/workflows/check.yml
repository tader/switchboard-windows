name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected release PR head
        required: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - {runner: windows-latest, rid: win-x64}
          - {runner: windows-11-arm, rid: win-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        shell: pwsh
        env: {EXPECTED_SHA: '${{ inputs.expected_sha }}'}
        run: if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Revision mismatch' }
      - run: dotnet publish src/Switchboard/Switchboard.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o .dist/${{ matrix.rid }}
      - run: dotnet run --project tests/Smoke/Smoke.csproj -c Release -- .dist/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'Switchboard-${{ matrix.rid }}-unsigned-development', path: '.dist/'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'screenshots-${{ matrix.rid }}', path: '.dist/screenshots/'}
