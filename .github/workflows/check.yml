name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected release PR head
        required: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - {runner: windows-latest, rid: win-x64}
          - {runner: windows-11-arm, rid: win-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        shell: pwsh
        env: {EXPECTED_SHA: '${{ inputs.expected_sha }}'}
        run: if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Revision mismatch' }
      - run: dotnet publish src/Switchboard/Switchboard.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o .dist/${{ matrix.rid }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tader/switchboard
          ref: f759fbc7dbfd08f60ac85a848c1f10f35b0b70cd
          path: .core-contract
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: npm ci --prefix .core-contract
      - name: Build the preview filesystem adapter
        run: npm exec --yes --package=node-gyp@13.1.0 -- node-gyp rebuild --directory .core-contract/native/activity-preview-store
      - name: Verify preview filesystem safety
        working-directory: .core-contract
        run: node --test test/windows-preview-store.test.ts
      - run: npm ci --prefix .core-contract/web
      - run: npm run build --prefix .core-contract/web
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .core-contract/bin | Out-Null
          Copy-Item (Get-Command node).Source .core-contract/bin/node.exe
          # This source-built fixture has just built and verified its native adapter.
          # Packaged x64/ARM64 adapter checks run separately in core's runtime CI.
          node -e "const fs=require('node:fs');const version=require('./.core-contract/package.json').version;fs.writeFileSync('.core-contract/build-info.json',JSON.stringify({version,platform:'win32',arch:process.arch,activityPreviewStore:1}));fs.writeFileSync('.core-contract/runtime.json',JSON.stringify({version}));"
      - run: dotnet run --project tests/Smoke/Smoke.csproj -c Release -- .dist/screenshots .core-contract
      - name: Build fixed runtime for native repair
        shell: pwsh
        working-directory: .core-contract
        env:
          RUNTIME_ARCH: ${{ matrix.rid == 'win-arm64' && 'arm64' || 'x64' }}
        run: |
          $version = 'v24.22.3'
          $archive = "node-$version-win-$env:RUNTIME_ARCH.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$version/$archive" -OutFile "$env:RUNNER_TEMP/$archive"
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/$version/SHASUMS256.txt").Content
          $line = $sums -split "`n" | Where-Object { $_.Trim().EndsWith(" $archive") }
          if (!$line -or (Get-FileHash "$env:RUNNER_TEMP/$archive" -Algorithm SHA256).Hash.ToLower() -ne ($line -split '\s+')[0]) { throw 'Node checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/$archive" "$env:RUNNER_TEMP/repair-node"
          python scripts/package-runtime.py --platform win32 --node "$env:RUNNER_TEMP/repair-node/node-$version-win-$env:RUNTIME_ARCH/node.exe" --arch $env:RUNTIME_ARCH --revision (git rev-parse HEAD) --output "$env:RUNNER_TEMP/repair-package"
          if ($LASTEXITCODE) { throw 'Fixed runtime packaging failed' }
          $package = "$env:RUNNER_TEMP/repair-package"
          $manifest = Get-Content "$package/runtime-win32-$env:RUNTIME_ARCH.json" | ConvertFrom-Json
          if ((Get-FileHash "$package/$($manifest.archive)" -Algorithm SHA256).Hash.ToLower() -ne $manifest.sha256) { throw 'Runtime checksum mismatch' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/repair-runtime" | Out-Null
          tar -xzf "$package/$($manifest.archive)" -C "$env:RUNNER_TEMP/repair-runtime"
          if ($LASTEXITCODE) { throw 'Fixed runtime extraction failed' }
          Copy-Item "$package/runtime-win32-$env:RUNTIME_ARCH.json" "$env:RUNNER_TEMP/repair-runtime/runtime.json"
      - name: Rehearse native historical upgrade, repair and Activity reveal
        shell: pwsh
        run: dotnet run --project tests/Smoke/Smoke.csproj -c Release -- --repair "$env:RUNNER_TEMP/repair-runtime" tests/Smoke/reveal-repair.mjs .dist/screenshots
      - name: Exercise real tray app entry point
        shell: pwsh
        run: |
          $app = Start-Process ".dist/${{ matrix.rid }}/Switchboard.exe" -ArgumentList '--show-settings' -PassThru
          try {
            Start-Sleep 5
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowTitle -ne 'Switchboard') { throw 'App did not open settings' }
            $app.CloseMainWindow() | Out-Null
            Start-Sleep 1
            if ($app.HasExited) { throw 'Closing settings quit the tray app' }
            $second = Start-Process ".dist/${{ matrix.rid }}/Switchboard.exe" -ArgumentList '--show-settings' -PassThru
            if (!$second.WaitForExit(10000)) { throw 'Second instance did not activate the first' }
            Start-Sleep 1
            $app.Refresh()
            if ($app.MainWindowTitle -ne 'Switchboard') { throw 'Activation did not reopen settings' }
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }
      - name: Package unsigned development installer
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path .tools
          .tools/vpk pack --packId Switchboard.Windows --packVersion 0.1.0 --packDir .dist/${{ matrix.rid }} --mainExe Switchboard.exe --channel ${{ matrix.rid }} --runtime ${{ matrix.rid }} --icon Assets/AppIcon.ico --outputDir .dist/installer-${{ matrix.rid }}
          if ($LASTEXITCODE) { throw 'Development packaging failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'Switchboard-${{ matrix.rid }}-unsigned-development', path: '.dist/'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'screenshots-${{ matrix.rid }}', path: '.dist/screenshots/'}
